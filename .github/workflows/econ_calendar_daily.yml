name: econ_calendar_daily

on:
  schedule:
    - cron: "40 1 * * *" # 10:40 KST daily
  workflow_dispatch:
    inputs:
      horizon_days:
        description: "앞으로 며칠치 일정을 유지할지 (FRED는 3~4개월치만 미리 공개)."
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: econ-calendar-etl
  cancel-in-progress: false

jobs:
  run:
    name: sync schedule, forecasts, and recent actual overlap
    if: ${{ vars.ECON_CALENDAR_KILL != 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 잡이 타임아웃으로 죽으면 버퍼에 남은 로그가 통째로 사라져 원인을 못 본다.
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      DISCORD_WEBHOOK_OPS_ACTIONS: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: data
          require-env: "SUPABASE_URL SUPABASE_SERVICE_KEY FRED_API_KEY ECOS_API_KEY EIA_API_KEY"
      - name: Run incremental daily ECON sync
        run: |
          python -m investment_agent.data.macro.commands.econ_calendar_daily \
            --horizon-days "${{ github.event.inputs.horizon_days || '120' }}"

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: run
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.run.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
