name: universe_membership_check

on:
  # 미국 월·수·금 장 마감 뒤. KST 화·목·토 07:40이며 DST에도 미국 장 마감 이후다.
  schedule:
    - cron: "40 22 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: universe-refresh
  cancel-in-progress: false

jobs:
  membership:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT || vars.EDGAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: data
          require-env: "SUPABASE_URL SUPABASE_SERVICE_KEY EDGAR_USER_AGENT"
      - name: Validate secret formats
        run: |
          printf '%s' "$EDGAR_USER_AGENT" | grep -qiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'
      - name: Check current S&P 500 membership
        id: universe
        run: python -m investment_agent.data.universe.commands.universe_membership
      - name: Dispatch downstream backfills only for a changed tracked set
        if: ${{ steps.universe.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run market_backfill.yml --ref "$GITHUB_REF_NAME" -f scope=missing -f dataset=both
          gh workflow run fundamentals_backfill.yml --ref "$GITHUB_REF_NAME" -f scope=missing
          gh workflow run fundamentals_dimensions_backfill.yml --ref "$GITHUB_REF_NAME" -f scope=missing -f period=both

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: membership
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.membership.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
