name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install dependency group
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install offline test dependencies
        run: true # dev group prepared above
      - name: Compile Python modules
        run: uv run python -m compileall -q src tests
      - name: Run offline unit tests
        env:
          TRADING_KILL_SWITCH: "on"
          LIVE_ENABLED: "false"
          AI_INVESTOR_EXTERNAL_NEWS_SOCIAL: "false"
        run: uv run python -m unittest discover -s tests -t .

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: offline-unit-tests
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.offline-unit-tests.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
