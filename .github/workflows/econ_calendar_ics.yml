name: econ_calendar_ics

on:
  # 일정 수집 뒤에 붙는다. 순서가 뒤바뀌면 어제 일정으로 캘린더를 덮어쓴다.
  workflow_run:
    workflows: ["econ_calendar_daily"]
    types: [completed]
    branches: [main]
  # cron 안전망은 두지 않는다. 실측(2026-08-21~09-21): 상류 체인은 29/29 발화하고
  # 지연 중앙 0.0분인데, 같은 일을 하던 cron은 드롭 30% · 지연 중앙 270분이었다.
  # 안전망이 얻는 것 없이 하루 두 번 실행과 두 번의 실패 알림만 만들었다(감사 AU-02).
  # 상류가 아예 안 도는 날은 상류 알림이 이미 울린다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: econ-calendar-etl
  cancel-in-progress: false

jobs:
  run:
    name: publish ics
    # 수집이 일부 실패해도 이미 저장된 일정으로 캘린더는 낼 수 있다. 취소만 거른다.
    if: ${{ vars.ECON_CALENDAR_KILL != 'on' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 잡이 타임아웃으로 죽으면 버퍼에 남은 로그가 통째로 사라져 원인을 못 본다.
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ECON_CALENDAR_ICS_BUCKET: ${{ vars.ECON_CALENDAR_ICS_BUCKET }}
      DISCORD_WEBHOOK_OPS_ACTIONS: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: data
      - name: Publish calendar feed
        run: python -m investment_agent.data.macro.commands.econ_calendar_publish_ics

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: run
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.run.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
