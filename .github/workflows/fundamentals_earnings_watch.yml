name: fundamentals_earnings_watch

# 발표 세션(BMO/AMC)이 끝난 직후 관심종목 실적 공시를 재확인하는 안전망.
#
# 왜 두 번인가: 장전 발표는 06:00~09:30 ET, 장후 발표는 16:00~17:30 ET에 접수된다.
# 하루 한 번만 훑으면 장전 발표가 최대 15시간 늦게 잡힌다. 세션마다 한 번씩 건다.
#
# 이 워크플로는 **안전망**이다. 노트북(로컬 하네스)이 켜져 있으면 같은 진입점을
# 세션 창 안에서 짧은 주기로 돌려 훨씬 먼저 잡는다. 둘이 겹쳐 돌아도
# notification producer가 Discord 발송 **전에** notifications.outbox 자리를
# 선점하므로 정확히 한 쪽만 보낸다.
on:
  schedule:
    # 1차 — 13:00 UTC = 22:00 KST = 09:00 ET. 장전(BMO) 발표가 끝난 직후.
    - cron: "0 13 * * 1-5"
    # 2차 — 22:00 UTC = 07:00 KST(익일) = 18:00 ET. 장후(AMC) 발표가 끝난 직후.
    # fundamentals_watchlist_fast가 21:30 UTC에 같은 concurrency 그룹으로 돌기 때문에
    # 30분 비켜 세운다. 겹치면 뒤에 온 쪽이 앞 잡(timeout 30분)이 끝날 때까지 큐에서
    # 대기해 시각이 되레 불규칙해진다.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "수집할 세션. auto는 현재 ET 시각으로 판정한다."
        required: false
        default: "auto"
        type: choice
        options: ["auto", "bmo", "amc", "any"]

permissions:
  contents: read

# 로컬 하네스와의 겹침은 DB가 막는다. 여기서는 Actions끼리의 겹침만 막으면 된다.
concurrency:
  group: fundamentals-etl
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ vars.FUNDAMENTALS_KILL != 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT || vars.EDGAR_USER_AGENT }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_EARNINGS: ${{ secrets.DISCORD_CHANNEL_EARNINGS }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-job
        with:
          group: notifications
          require-env: "SUPABASE_URL SUPABASE_SERVICE_KEY EDGAR_USER_AGENT DISCORD_BOT_TOKEN"

      - name: Validate flash notification subscription
        run: python -m investment_agent.operations.commands.validate_subscriptions --kind fundamentals_flash

      # cron으로 들어오면 어느 스케줄이 깨웠는지로 세션을 정한다. auto도 같은 답을
      # 내지만, 워크플로 로그에 의도가 남는 편이 사후 추적에 낫다.
      - name: Resolve session
        id: resolve
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1-5")  echo "session=bmo" >> "$GITHUB_OUTPUT" ;;
            "0 22 * * 1-5")  echo "session=amc" >> "$GITHUB_OUTPUT" ;;
            *) echo "session=${{ inputs.session || 'auto' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Watch earnings filings
        run: >-
          python -m investment_agent.operations.commands.watch_earnings
          --session "${{ steps.resolve.outputs.session }}"
          --notify
          --poll-attempts 5

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: watch
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.watch.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
