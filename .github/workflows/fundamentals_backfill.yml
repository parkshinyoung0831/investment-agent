name: fundamentals_backfill

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "missing=신규 종목, gaps=미완료 공시(실패 자동 재시도), all=전체 재계산"
        required: true
        default: gaps
        type: choice
        options:
          - missing
          - gaps
          - all
      backfill_from:
        description: "YYYY-MM-DD. Leave empty for the default ten-year window."
        required: false
        default: ""
      tickers:
        description: "Optional comma-separated tracked tickers for a bounded rerun."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fundamentals-etl
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ vars.FUNDAMENTALS_KILL != 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT || vars.EDGAR_USER_AGENT }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-job
        with:
          group: data
          require-env: "SUPABASE_URL SUPABASE_SERVICE_KEY EDGAR_USER_AGENT"
      - name: Validate secret formats
        run: |
          printf '%s' "$EDGAR_USER_AGENT" | grep -qiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'

      - name: Run fundamentals backfill
        shell: bash
        run: |
          ARGS=()
          if [ -n "${{ inputs.backfill_from }}" ]; then
            ARGS+=(--backfill-from "${{ inputs.backfill_from }}")
          fi
          if [ -n "${{ inputs.tickers }}" ]; then
            ARGS+=(--tickers "${{ inputs.tickers }}")
          fi
          SCOPE="${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'missing' }}"
          python -m investment_agent.data.fundamentals.commands.backfill_history --content company --scope "$SCOPE" "${ARGS[@]}"

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: backfill
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.backfill.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
