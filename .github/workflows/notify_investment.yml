name: notify_investment

# 포트폴리오 제안·승인·주문은 로컬 runtime SQLite에만 존재한다. GitHub hosted
# runner는 그 원장을 볼 수 없으므로 예약 실행은 항상 빈 원장을 읽거나 실패했다.
# 정규 발송은 원장 소유자인 로컬 하네스가 담당하고, 이 워크플로는 수동 진단용이다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify_investment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_AI_REPORTS: ${{ secrets.DISCORD_CHANNEL_AI_REPORTS }}
      DISCORD_CHANNEL_AI_TRADES: ${{ secrets.DISCORD_CHANNEL_AI_TRADES }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: notifications
          require-env: SUPABASE_URL SUPABASE_SERVICE_KEY DISCORD_BOT_TOKEN
      - uses: ./.github/actions/runtime-ledger
        with:
          scope: investment
      - name: Validate notification subscriptions
        run: >-
          python -m investment_agent.operations.commands.validate_subscriptions
          --kind investment_portfolio --kind investment_candidates --kind investment_trades
      - name: Send portfolio report
        run: python -m investment_agent.operations.commands.notify --kind investment_portfolio
      - name: Send candidate reports
        run: python -m investment_agent.operations.commands.notify --kind investment_candidates
      - name: Send trade reports
        run: python -m investment_agent.operations.commands.notify --kind investment_trades

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: run
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.run.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
