name: fundamentals_daily

on:
  schedule:
    # 12:30 KST Tue-Sat = 03:30 UTC = 전일 23:30 ET. SEC 일별 인덱스가 확정된 뒤에
    # 돌아야 공시를 하루 늦게 잡지 않는다.
    - cron: "30 3 * * 2-6"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "SEC daily-index days to inspect. Use a larger value only for catch-up."
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: fundamentals-etl
  cancel-in-progress: false

jobs:
  daily:
    if: ${{ vars.FUNDAMENTALS_KILL != 'on' }}
    runs-on: ubuntu-latest
    # Normal runs only fetch a handful of changed companies. The first API run
    # may need to catch up filings that were absent from the quarterly bulk set.
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT || vars.EDGAR_USER_AGENT }}
      FUNDAMENTALS_INDEX_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/python-job
        with:
          group: data
          require-env: "SUPABASE_URL SUPABASE_SERVICE_KEY EDGAR_USER_AGENT"
      - name: Validate secret formats
        run: |
          printf '%s' "$EDGAR_USER_AGENT" | grep -qiE '[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}'

      - name: Run fundamentals daily
        run: python -m investment_agent.data.fundamentals.commands.sync_filings --content company

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: daily
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.daily.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
