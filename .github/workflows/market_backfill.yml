name: market_backfill

on:
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "YYYY-MM-DD. 비우면 OHLCV 10년 기본값 사용."
        required: false
        default: ""
      scope:
        description: "missing=신규 종목만, all-current=현재 S&P500 전체 이력 확장/보수"
        required: true
        default: "missing"
        type: choice
        options:
          - missing
          - all-current

permissions:
  contents: read

concurrency:
  group: market-etl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: data
      - name: Run market backfill
        run: |
          ARGS=""
          if [ -n "${{ inputs.backfill_from }}" ]; then
            ARGS="$ARGS --backfill-from ${{ inputs.backfill_from }}"
          fi
          ARGS="$ARGS --scope ${{ inputs.scope || 'missing' }}"
          python -m investment_agent.data.market.commands.market_backfill $ARGS

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: backfill
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.backfill.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
