name: fundamentals_expectations

# 시세 적재 직후 수집해 목표주가와 현 시세의 관측 시점을 가깝게 유지한다.
on:
  workflow_run:
    workflows: ["market_daily"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "all=S&P 500 전체(기본), watchlist=관심종목만"
        required: false
        default: all
        type: choice
        options: [watchlist, all]

permissions:
  contents: read

concurrency:
  group: fundamentals-etl
  cancel-in-progress: false

jobs:
  daily:
    # market_daily가 종목 하나로 exit 1 해도 목표주가·컨센서스는 멀쩡하다.
    # success로 잠그면 그런 날 예상치가 통째로 하루 밀린다 — 취소만 걸러낸다.
    if: >-
      ${{ vars.FUNDAMENTALS_KILL != 'on'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python-job
        with:
          group: data
      # 모든 원천 응답을 모은 뒤 저장하므로, 25분 예산 초과는 부분 snapshot을 남기지
      # 않고 폐기한다. 외부 timeout은 응답이 멈춘 경우에도 저장 단계 전에서 끊는다.
      - name: Collect analyst consensus
        timeout-minutes: 32
        run: >-
          timeout -k 30 1800 python -m investment_agent.data.fundamentals.commands.refresh_expectations
          --scope "${{ inputs.scope || 'all' }}"
          --collection-budget-sec 1500
          --workers 4

  notify-error:
    if: ${{ failure() || cancelled() }}
    needs: daily
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ops_failure_report.yml
    with:
      source_conclusion: ${{ needs.daily.result }}
    secrets:
      discord_webhook_ops: ${{ secrets.DISCORD_WEBHOOK_OPS_ACTIONS }}
