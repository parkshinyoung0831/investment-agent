name: python-job
description: >-
  파이썬 잡의 공통 준비 — 런타임 설치, 필수 secret 확인, 의존성 설치.
  워크플로마다 같은 네 단계를 베끼던 것을 한 자리로 모은다.

# 호출하는 쪽이 먼저 actions/checkout을 해야 한다. composite action 파일 자체가
# 체크아웃된 트리 안에 있어서, 이 안에서 체크아웃하면 순서가 뒤집힌다.

inputs:
  group:
    description: >-
      설치할 uv dependency group. **잡마다 다르게 준다** — 전부 dev group을
      쓰면 embed 한 줄 보내는 잡이 Playwright까지 받느라 몇 분을 쓰고, 그 시간은
      월 2,000분 한도에서 그대로 빠진다.
    required: true
  python-version:
    description: 파이썬 버전. Actions 기준은 3.11이다.
    required: false
    default: "3.11"
  require-env:
    description: >-
      비어 있으면 안 되는 환경변수 이름(공백 구분). secret 이름을 오타 내면 값이
      빈 문자열로 들어오는데, 그러면 잡은 실패하지 않고 **0행을 성공적으로 적재**한다.
      그래서 일을 시작하기 전에 여기서 막는다.
    required: false
    default: "SUPABASE_URL SUPABASE_SERVICE_KEY"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: uv.lock

    - name: Validate required secrets
      shell: bash
      # 입력을 스크립트 본문에 직접 펼치지 않고 env로 건넨다. 본문에 펼치면 그 값이
      # 셸 코드로 해석되는 자리가 생긴다 — 지금은 워크플로 파일이 쓰는 값뿐이지만,
      # 언제든 표현식이 끼어들 수 있는 자리를 남겨두지 않는다.
      env:
        REQUIRE_ENV: ${{ inputs.require-env }}
      # 이름만 말하고 값은 절대 찍지 않는다. 로그는 공개될 수 있다.
      run: |
        missing=""
        for name in $REQUIRE_ENV; do
          if [ -z "${!name}" ]; then
            missing="$missing $name"
          fi
        done
        if [ -n "$missing" ]; then
          echo "::error::required secrets are empty:$missing"
          exit 1
        fi

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install uv==0.12.10
        uv sync --locked --no-dev --group "${{ inputs.group }}"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
