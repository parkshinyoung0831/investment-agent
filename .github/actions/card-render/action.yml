name: card-render
description: >-
  PNG 카드를 렌더할 수 있는 상태로 만든다 — Chromium과 CJK 폰트.
  카드를 실제로 보낼 때만 부른다.

# ## 왜 별도 action인가
#
# 카드가 없는 날에도 이 설치를 하면 몇 분이 그냥 사라진다(월 2,000분 한도). 반대로
# embed 잡의 설치에 이것을 묶으면, 카드가 없는 날 속보가 `import` 단계에서 죽는다.
# 그래서 "무엇을 보낼지"에 따라 설치를 나누고, 카드 쪽만 이 action을 부른다.
#
# ## 여기 담긴 것은 전부 실측으로 얻은 것이다
#
#   * `fonts-noto-cjk`는 61MB이고 azure 미러가 죽는 날이 있다. 2026-08-19에 300초
#     상한에 걸려 매크로 카드 2종이 통째로 빠졌다. 그래서 한 번 받아 캐시에 넣고
#     그 뒤로는 apt를 아예 건너뛴다.
#   * `playwright install --with-deps chromium` 하나로 묶으면, 러너 이미지가 이미
#     갖고 있는 시스템 라이브러리를 apt로 다시 받다가 제한에 걸려 **브라우저 설치까지
#     함께 죽는다**(같은 날 exit 124). 필수(브라우저)와 선택(시스템 lib)을 나눈다.
#   * 폰트가 없는 채로 렌더하면 한글이 통째로 두부(□)로 나간다. 그것은 예외를
#     던지지 않으므로, 렌더 전에 여기서 확인하고 없으면 멈춘다.

inputs:
  cache-key:
    description: >-
      Chromium 캐시 키에 붙일 구분자. 보통 해당 잡의 uv.lock을 쓴다.
    required: true

runs:
  using: composite
  steps:
    # 캐시에 들어가는 것은 러너 이미지에 링크된 브라우저 바이너리다. 키에 이미지를
    # 넣지 않으면 22.04에서 받은 chromium이 24.04 러너로 복원되고, 그때 나는 것은
    # 설치 오류가 아니라 렌더 시점의 실행 실패다.
    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ env.ImageOS }}-${{ hashFiles(inputs.cache-key) }}

    - name: Cache CJK font
      uses: actions/cache@v5
      with:
        path: ~/.local/share/fonts
        key: noto-cjk-1

    # composite action의 스텝은 `timeout-minutes`를 지원하지 않는다. 대신 안쪽
    # `timeout` 명령이 각 구간을 묶는다(apt 120+420초, playwright 240+240초).
    # 잡 전체 상한은 부르는 워크플로가 건다.
    - name: Install Chromium and fonts
      shell: bash
      run: |
        if [ -z "$(ls -A "$HOME/.local/share/fonts" 2>/dev/null)" ]; then
          mkdir -p "$HOME/.local/share/fonts"
          sudo timeout -k 30 120 apt-get update || echo "apt-get update timed out; using image package lists"
          sudo timeout -k 30 420 apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          cp /usr/share/fonts/opentype/noto/NotoSansCJK*.ttc "$HOME/.local/share/fonts/" || true
        fi
        fc-cache -f >/dev/null
        fc-list | grep -qi "noto sans cjk" || { echo "::error::CJK font missing; cards would render as tofu"; exit 1; }
        sudo timeout -k 30 240 python -m playwright install-deps chromium || echo "playwright deps skipped (image libs)"
        timeout -k 30 240 python -m playwright install chromium
